<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu</title>
    <script src="{{ url_for('static', filename='js/jquery.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="menu-container">
        {% if game_exists %}
        <button id="newGameBtn" disabled>New Game</button>
        <button id="loadGameBtn" disabled>Load Game</button>
        <button id="saveGameBtn">Save Game</button>
        <button id="joinMPBtn" disabled>Join Game</button>
        {% else %}
        <button id="newGameBtn">New Game</button>
        <button id="loadGameBtn">Load Game</button>
        <button id="saveGameBtn" disabled>Save Game</button>
        <button id="joinMPBtn" >Join Game</button>
        {% endif %}
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
